[workspace]
members = ["crates/crashledger-core", "crates/crashledger-scenario", "crates/crashledger-cli", "crates/crashledger-http", "crates/crashledger-oracle", "crates/crashledger-engine", "crates/crashledger-evidence", "fixtures/order-service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SaridakisStamatisChristos/CrashLedger"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
url = "2"
