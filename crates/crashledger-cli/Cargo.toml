[package]
name = "crashledger-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CrashLedger local correctness experiment CLI"

[[bin]]
name = "crashledger"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crashledger-scenario = { path = "../crashledger-scenario" }
crashledger-core = { path = "../crashledger-core" }
crashledger-engine = { path = "../crashledger-engine" }
crashledger-evidence = { path = "../crashledger-evidence" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
