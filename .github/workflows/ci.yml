name: Rust CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: CLI smoke test
        run: cargo run --locked -p crashledger-cli -- validate scenarios/lost-ack.yaml
      - name: End-to-end broken negative control (exit 2)
        run: |
          set +e
          cargo run --locked -p crashledger-cli -- demo --mode broken > broken-demo.log 2>&1
          code=$?
          set -e
          cat broken-demo.log
          test "$code" -eq 2
          grep -q 'Verdict: FAIL' broken-demo.log
          grep -q 'orders_for_key = 2; expected = 1' broken-demo.log
          grep -q 'Attempts: 2' broken-demo.log
      - name: End-to-end fixed positive control (exit 0)
        run: |
          cargo run --locked -p crashledger-cli -- demo --mode fixed > fixed-demo.log 2>&1
          cat fixed-demo.log
          grep -q 'Verdict: PASS' fixed-demo.log
          grep -q 'orders_for_key = 1; expected = 1' fixed-demo.log
          grep -q 'Attempts: 2' fixed-demo.log
      - name: Independent offline bundle verification
        run: |
          broken_dir="$(sed -n 's/^Artifacts: //p' broken-demo.log | tail -1)"
          fixed_dir="$(sed -n 's/^Artifacts: //p' fixed-demo.log | tail -1)"
          test -n "$broken_dir" && test -n "$fixed_dir"
          python3 scripts/verify_bundle.py "$broken_dir" --expect-mode broken --expect-verdict FAIL --expect-count 2
          python3 scripts/verify_bundle.py "$fixed_dir" --expect-mode fixed --expect-verdict PASS --expect-count 1
          cargo run --locked -p crashledger-cli -- report "$broken_dir" --format text
          cargo run --locked -p crashledger-cli -- report "$fixed_dir" --format json
          python3 - "$fixed_dir" <<'PY'
          from pathlib import Path
          import sys
          target = Path(sys.argv[1]) / "events.jsonl"
          target.write_bytes(target.read_bytes() + b"TAMPER\n")
          PY
          set +e
          python3 scripts/verify_bundle.py "$fixed_dir"
          verify_code=$?
          cargo run --locked -p crashledger-cli -- report "$fixed_dir" --format json
          report_code=$?
          set -e
          test "$verify_code" -eq 4
          test "$report_code" -eq 4
      - name: PR-06 independently managed service and negative cases
        run: python3 scripts/test_standalone.py
      - name: README demonstration script (two independent controls)
        run: bash scripts/demo.sh

  portable:
    name: Portable Rust build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build portable workspace
        run: cargo build --locked --workspace
      - name: Test portable workspace excluding Linux-only 100-pair stress
        run: cargo test --locked --workspace --exclude crashledger-engine
      - name: Validate reference scenario
        run: cargo run --locked -p crashledger-cli -- validate scenarios/lost-ack.yaml
