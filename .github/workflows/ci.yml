name: Rust CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: PR-02 temporary lock and format evidence capture
        run: |
          cargo generate-lockfile
          echo CRASHLEDGER_LOCK_V2_START
          cat Cargo.lock
          echo CRASHLEDGER_LOCK_V2_END
          cargo fmt --all
          echo CRASHLEDGER_FMT_DIFF_START
          git diff -- crates/ fixtures/
          echo CRASHLEDGER_FMT_DIFF_END
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: CLI smoke test
        run: cargo run --locked -p crashledger-cli -- validate scenarios/lost-ack.yaml
